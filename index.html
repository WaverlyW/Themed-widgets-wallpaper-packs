<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theme Pack Studio</title>
  <meta name="description" content="Build, preview and export themed widget and wallpaper packs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Fraunces:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Nunito:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      Theme Pack Studio
    </a>
    <nav class="topbar-actions">
      <button type="button" id="new-pack" class="btn">New pack</button>
      <label class="btn btn-ghost">
        Import JSON
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </label>
    </nav>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
